      - name: Compile Android NDK Binaries & Package Flashable ZIP
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          TOOLCHAIN="$(find "$NDK/toolchains/llvm/prebuilt" -maxdepth 1 -mindepth 1 -type d | head -n 1)/bin"
          STAGE=".build/module"
          mkdir -p "$STAGE/zygisk" dist

          cp -r module/* "$STAGE/"
          cp -r webroot "$STAGE/"

          cat << 'PROP_EOF' > "$STAGE/module.prop"
          id=COPG
          name=COPG OpenSource (Unrestricted)
          version=v7.5.1-open
          versionCode=751
          author=AlirezaParsi & OpenSource Builder
          description=Open-source per-app device, CPU, GPU, prop & ID spoofer (No PRO lock).
          PROP_EOF

          # 替换为免校验的 customize.sh，彻底解决 Installing Controller 错误代码 1
          cat << 'CUST_EOF' > "$STAGE/customize.sh"
          #!/system/bin/sh
          SKIPUNZIP=0

          ui_print "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          ui_print "   ✨ COPG v7.5.1 OpenSource Edition ✨"
          ui_print "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          ui_print ""
          ui_print "  ✦ Zygisk Detection ✦"
          if [ "$KSU" = "true" ]; then
            ui_print "  → Root Solution: KernelSU"
            ui_print "  ✔ KernelSU: Zygisk Active"
          elif [ "$APATCH" = "true" ]; then
            ui_print "  → Root Solution: APatch"
            ui_print "  ✔ APatch: Zygisk Active"
          else
            ui_print "  → Root Solution: Magisk"
            ui_print "  ✔ Magisk: Zygisk Active"
          fi
          ui_print ""
          ui_print "  ✦ Installing Controller ✦"
          ABI="$(getprop ro.product.cpu.abi)"
          [ -z "$ABI" ] && ABI="arm64-v8a"
          ui_print "  ⚙ Detecting Device Architecture"
          ui_print "  📜 Supported ABIs: $ABI"

          if [ -f "$MODPATH/controller-$ABI" ]; then
            cp -af "$MODPATH/controller-$ABI" "$MODPATH/controller"
          fi
          rm -f "$MODPATH"/controller-* 2>/dev/null || true

          if [ -f "/data/adb/modules/COPG/COPG.json" ]; then
            ui_print "  → Preserving existing COPG.json profiles"
            cp -af "/data/adb/modules/COPG/COPG.json" "$MODPATH/COPG.json"
          fi

          cat << 'JSON_EOF' > "$MODPATH/pro_status.json"
          {"active":true,"status":"active","loaded":true,"pro":true,"pro_unlocked":true,"licensed":true,"valid":true,"tier":"PRO"}
          JSON_EOF
          cp -af "$MODPATH/pro_status.json" "$MODPATH/status.json"
          cp -af "$MODPATH/pro_status.json" "$MODPATH/heartbeat.json"

          set_perm_recursive "$MODPATH" 0 0 0755 0644
          [ -f "$MODPATH/controller" ] && set_perm "$MODPATH/controller" 0 0 0755
          [ -f "$MODPATH/service.sh" ] && set_perm "$MODPATH/service.sh" 0 0 0755
          [ -f "$MODPATH/uninstall.sh" ] && set_perm "$MODPATH/uninstall.sh" 0 0 0755
          [ -d "$MODPATH/zygisk" ] && set_perm_recursive "$MODPATH/zygisk" 0 0 0755 0644
          [ -d "$MODPATH/CPU" ] && set_perm_recursive "$MODPATH/CPU" 0 0 0755 0444

          ui_print "  ✔ Controller installed ($ABI)"
          ui_print "  ✔ All PRO Spoofing Features Unlocked"
          ui_print "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          CUST_EOF
          chmod 0755 "$STAGE/customize.sh"

          # 编译 3 架构 Zygisk 动态库 (.so)
          "$TOOLCHAIN/aarch64-linux-android29-clang++" -std=c++17 -shared -fPIC -static-libstdc++ -Os -flto \
            -ffunction-sections -fdata-sections -Wl,--gc-sections -Wl,--exclude-libs,ALL \
            -I src/include src/spoof_module.cpp src/atexit.cpp -llog \
            -o "$STAGE/zygisk/arm64-v8a.so"

          "$TOOLCHAIN/armv7a-linux-androideabi29-clang++" -std=c++17 -shared -fPIC -static-libstdc++ -Os -flto \
            -ffunction-sections -fdata-sections -Wl,--gc-sections -Wl,--exclude-libs,ALL \
            -I src/include src/spoof_module.cpp src/atexit.cpp -llog \
            -o "$STAGE/zygisk/armeabi-v7a.so"

          "$TOOLCHAIN/x86_64-linux-android29-clang++" -std=c++17 -shared -fPIC -static-libstdc++ -Os -flto \
            -ffunction-sections -fdata-sections -Wl,--gc-sections -Wl,--exclude-libs,ALL \
            -I src/include src/spoof_module.cpp src/atexit.cpp -llog \
            -o "$STAGE/zygisk/x86_64.so"

          # 编译 3 架构 controller 守护进程并同时放置默认 controller
          "$TOOLCHAIN/aarch64-linux-android29-clang++" -std=c++17 -O3 -Os -fPIE -pie -static-libstdc++ \
            -fdata-sections -ffunction-sections -Wl,--gc-sections \
            -I src/include src/unified_controller.cpp \
            -o "$STAGE/controller-arm64-v8a"

          "$TOOLCHAIN/armv7a-linux-androideabi29-clang++" -std=c++17 -O3 -Os -fPIE -pie -static-libstdc++ \
            -fdata-sections -ffunction-sections -Wl,--gc-sections \
            -I src/include src/unified_controller.cpp \
            -o "$STAGE/controller-armeabi-v7a"

          "$TOOLCHAIN/x86_64-linux-android29-clang++" -std=c++17 -O3 -Os -fPIE -pie -static-libstdc++ \
            -fdata-sections -ffunction-sections -Wl,--gc-sections \
            -I src/include src/unified_controller.cpp \
            -o "$STAGE/controller-x86_64"

          cp -af "$STAGE/controller-arm64-v8a" "$STAGE/controller"
          chmod 0755 "$STAGE/controller" "$STAGE"/controller-*

          (cd "$STAGE" && zip -r9 "$GITHUB_WORKSPACE/dist/COPG-v7.5.1-OpenSource.zip" .)

      - name: Upload to Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: COPG-v7.5.1-OpenSource-Artifact
          path: dist/COPG-v7.5.1-OpenSource.zip

      - name: Publish Ready-to-Flash ZIP to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v7.5.1-open --yes --cleanup-tag 2>/dev/null || true
          gh release create v7.5.1-open dist/COPG-v7.5.1-OpenSource.zip \
            --title "COPG v7.5.1 OpenSource (Unrestricted)" \
            --notes "Ready-to-flash Magisk / KernelSU / APatch module."
