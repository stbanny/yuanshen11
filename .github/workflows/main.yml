name: Build COPG v7.5.1 OpenSource Module

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Official v7.5.1 Module, WebUI & OpenSource C++ Core
